# Risk-Aware Adaptive Multi-Cloud Selection: experiment configuration.
#
# The experiment runs in a SIMULATED multi-cloud environment (scripts/run_simulation.py).
# The provider and network values under `simulation:` are assumptions, not measurements.
# The design decisions recorded here are explained in README.md ("Design decisions").
#
# Units are in the key names: _s seconds, _ms milliseconds, _pct percent (0-100),
# _mbps megabits per second, _usd US dollars.

experiment:
  payload_path: data/payload_10MB.bin   # created automatically (scripts/make_payload.py)
  payload_size_bytes: 10485760          # 10 MiB
  payload_seed: 2026                    # payload content is reproducible from this seed
  # Measured paired rounds per condition (>= 8; a multiple of 3 balances the
  # degraded-provider rotation). run_simulation.py --rounds-per-condition overrides it.
  rounds_per_condition: 9
  # Warm-up rounds at the start of every block, so the risk history is not empty.
  # Warm-up rows are stored (is_warmup = 1) and analysed separately.
  warmup_rounds_per_block: 2
  cooldown_s: 5                         # simulated pause between two transfers
  strategies: [proposed, static_network, cost_only, nearest, random]
  conditions: [natural, mild, severe]

providers:
  # The three simulated providers. Names and regions describe what each simulated
  # provider stands for; their behaviour is set under `simulation:` below.
  aws_s3: {region: ap-south-1}          # Mumbai: near
  gcs:    {region: europe-west1}        # Belgium: medium distance
  b2:     {region: us-west-004}         # US West: far, cheapest

cost:
  # Approximate list prices (USD); used only to rank the providers by cost.
  # Uploads (ingress) are free on all three, so the cost score uses storage and egress.
  storage_months: 1                 # how long the object is assumed to be kept
  egress_fraction: 1.0              # expected downloads of the file, as a fraction of its size
  # How cost is turned into C_i in [0, 1] (higher = cheaper).
  #   min_max: cheapest -> 1, most expensive -> 0
  #   ratio:   cheapest_cost / cost_i (keeps relative differences)
  normalisation: min_max
  table:
    aws_s3: {storage_usd_per_gb_month: 0.025, egress_usd_per_gb: 0.11}
    gcs:    {storage_usd_per_gb_month: 0.020, egress_usd_per_gb: 0.12}
    b2:     {storage_usd_per_gb_month: 0.006, egress_usd_per_gb: 0.01}

nearest_region:
  # How "fixed-nearest-region" picks its provider. Determined ONCE from the natural
  # baseline and never re-evaluated during the run.
  #   min_median_rtt: lowest median RTT in the natural baseline
  #   fixed:          use `fixed_provider`
  method: min_median_rtt
  fixed_provider: null

probe:
  # Probing time counts in the end-to-end time of the network-aware strategies.
  # A probe of one provider = `samples` TCP-connect RTT samples (one RTT each) plus a
  # small upload of `throughput_bytes` (3 RTTs set-up + transfer).
  #   rtt  = median of the samples; loss = lost samples / samples
  #   (VERY COARSE: with 3 samples loss moves in 33 % steps, so it only flags heavy
  #   loss; the risk history picks up the resulting failures)
  # Reduced from 10 samples / 512 KiB to cut probe overhead (see README, results).
  samples: 3
  throughput_bytes: 131072         # 128 KiB
  timeout_s: 10                    # per-provider throughput-probe timeout
  # Probe reuse (see rmc.runner.runner): a network-aware strategy reuses its own
  # last probes while they are at most max_age_s old. 0 = probe before every
  # decision. Applies equally to proposed and static_network.
  max_age_s: 60
  reprobe_after_failure: true      # drop the reused probes after any failed attempt
  calibration_samples: 20          # probes per provider for the natural baseline

transfer:
  # A timed-out upload counts as a failure and triggers failover.
  timeout_s: 60
  max_attempts: 3                  # first choice + up to 2 failovers (there are 3 providers)
  retry_on_verify_failure: true    # a checksum mismatch counts as a failure
  # Every upload gets a unique key under this prefix; objects are never overwritten.
  object_prefix: rmc-trials

network_score:
  # N_i is built from RTT, throughput and loss (component weights sum to 1).
  components: {rtt: 0.34, throughput: 0.33, loss: 0.33}
  #   min_max:   across the 3 providers at decision time (with 3 values the best
  #              always gets 1 and the worst 0, even if they are nearly equal)
  #   reference: against the fixed ranges below
  normalisation: min_max
  reference:
    rtt_ms: [0, 500]
    throughput_mbps: [0, 100]
    loss_pct: [0, 10]

risk:
  # rho_i in [0, 1]: observed unreliability (not cybersecurity).
  window_k: 10                  # the K most recent attempts per provider
  # Whose transfers feed the proposed strategy's history.
  #   own: only attempts made by the proposed strategy
  #   all: attempts made by every strategy (more data, but the proposed method
  #        would then learn from the baselines' choices)
  history_source: own
  history_scope: block          # history is reset at the start of each block
  # Weighted mean of components already in [0, 1].
  components:
    timeout_rate: 0.30
    failure_rate: 0.30
    transfer_time_cv: 0.20      # coefficient of variation of recent transfer times
    loss_std: 0.10              # std dev of recent probe loss
    rtt_cv: 0.10                # large performance fluctuation
  # Caps used to map unbounded components into [0, 1] (value / cap, clipped).
  caps:
    transfer_time_cv: 1.0
    loss_std_pct: 5.0
    rtt_cv: 1.0
  cold_start_rho: 0.0           # rho when a provider has no history yet

weights:
  # Weight-adaptation rule. Pluggable: other rules can be added in
  # src/rmc/selection/weights.py and selected by name here.
  rule: two_profile
  profiles:
    normal: {network: 0.40, cost: 0.40, risk: 0.20}
    severe: {network: 0.45, cost: 0.10, risk: 0.45}
  # Degradation indicator: compare live probes with the natural baseline.
  # "severe" profile if ANY provider exceeds a threshold.
  degradation_indicator:
    rtt_increase_ratio: 0.5     # live RTT >= baseline * (1 + 0.5)
    loss_pct: 2.0               # live loss >= 2 %

static_network:
  # Static network-aware baseline: live network score only, no cost, no risk.
  weights: {network: 1.0, cost: 0.0, risk: 0.0}

random_strategy:
  seed: 12345                   # recorded; random choices are reproducible

netem:
  # Network conditions, applied to ONE simulated provider path per block (like
  # Linux netem would on a real path): extra RTT as a fraction of the provider's
  # natural RTT, plus packet loss.
  conditions:
    natural: null
    mild:   {rtt_increase_ratio: 0.25, loss_pct: 1.0}
    severe: {rtt_increase_ratio: 1.00, loss_pct: 5.0}

storage:
  backup_dir: data/backups              # per-block database backups (not committed)

mock:
  # MADE-UP values for the unit tests only.
  seed: 7
  providers:
    aws_s3: {rtt_ms: 40,  throughput_mbps: 50, loss_pct: 0.1, failure_prob: 0.01, timeout_prob: 0.01, jitter_cv: 0.10}
    gcs:    {rtt_ms: 150, throughput_mbps: 40, loss_pct: 0.1, failure_prob: 0.01, timeout_prob: 0.01, jitter_cv: 0.10}
    b2:     {rtt_ms: 250, throughput_mbps: 30, loss_pct: 0.2, failure_prob: 0.02, timeout_prob: 0.01, jitter_cv: 0.15}

simulation:
  # Simulated multi-cloud environment used by scripts/run_simulation.py.
  # These are ASSUMED provider profiles (rough orders of magnitude for a client in
  # India uploading to Mumbai / Belgium / US-West), NOT measurements. Report any
  # results from them as simulation results and state these values.
  seed: 2026
  providers:
    aws_s3: {rtt_ms: 35,  throughput_mbps: 40, loss_pct: 0.1, failure_prob: 0.01,  timeout_prob: 0.005,
             jitter_cv: 0.20, loss_fail_per_pct: 0.02,
             episode_rate_per_hour: 3, episode_mean_s: 90, episode_slowdown: 3.0, episode_extra_fail: 0.15}
    gcs:    {rtt_ms: 140, throughput_mbps: 30, loss_pct: 0.2, failure_prob: 0.01,  timeout_prob: 0.005,
             jitter_cv: 0.25, loss_fail_per_pct: 0.02,
             episode_rate_per_hour: 3, episode_mean_s: 90, episode_slowdown: 3.0, episode_extra_fail: 0.15}
    b2:     {rtt_ms: 240, throughput_mbps: 20, loss_pct: 0.3, failure_prob: 0.02,  timeout_prob: 0.01,
             jitter_cv: 0.30, loss_fail_per_pct: 0.02,
             episode_rate_per_hour: 3, episode_mean_s: 90, episode_slowdown: 3.0, episode_extra_fail: 0.15}

analysis:
  metric: end_to_end_time_s
  # Primary paired test: wilcoxon (signed-rank, no normality assumption) or ttest.
  # Both are always reported.
  primary_test: wilcoxon
  # Correction over the primary family (4 baselines x 3 conditions = 12 tests).
  multiple_comparison: holm       # holm | none
  alpha: 0.05
  # Rounds where a transfer finally failed: include = keep its end-to-end time
  # (it contains the timeouts); exclude_pair = drop that pair from time tests.
  # Failures are always counted separately either way.
  failed_transfer_policy: include
